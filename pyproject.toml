[project]
name = "neoproxy-integration-tests"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "requests",
    "PyYAML",
    "aioquic",
    "pylsqpack>=0.3",
    "cryptography",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "basedpyright>=1.40.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "pydantic>=2.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_tests.py", "test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=60 --timeout-method=thread"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "all"
include = ["tests"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
